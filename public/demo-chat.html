<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Chatbot — HecTechAI</title>
<style>
  :root {
    --primary: #00e5a0;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --text-dim: #888;
    --user-bg: var(--primary);
    --bot-bg: #1e1e1e;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100svh; display: flex; flex-direction: column; }

  /* Demo banner */
  .demo-banner {
    background: rgba(255, 180, 0, 0.12);
    border-bottom: 1px solid rgba(255,180,0,0.25);
    padding: 8px 16px;
    font-size: 12px;
    color: #ffcc44;
    text-align: center;
    flex-shrink: 0;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #00a870);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    position: relative;
  }
  .online-dot {
    position: absolute; bottom: 1px; right: 1px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #22cc66;
    border: 2px solid var(--surface);
  }
  .header-info h1 { font-size: 15px; font-weight: 600; }
  .header-info p  { font-size: 12px; color: var(--primary); }
  .demo-badge {
    margin-left: auto;
    background: rgba(255,180,0,0.15);
    border: 1px solid rgba(255,180,0,0.3);
    color: #ffcc44;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
  }

  /* Messages area */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #0c0c0c;
    scroll-behavior: smooth;
  }
  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; }
  .msg.bot  { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .msg.bot  .msg-avatar { background: rgba(0,229,160,0.15); color: var(--primary); }
  .msg.user .msg-avatar { background: #2a2a2a; color: #aaa; }
  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg.bot  .bubble { background: var(--bot-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: var(--primary); color: #000; font-weight: 500; border-bottom-right-radius: 4px; }
  .bubble .typing { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
  .bubble .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .bubble .typing span:nth-child(2) { animation-delay: 0.2s; }
  .bubble .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* Input area */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .input-wrap { flex: 1; position: relative; }
  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 42px;
    line-height: 1.4;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--primary); }
  textarea::placeholder { color: var(--text-dim); }
  textarea:disabled { opacity: 0.5; }
  .send-btn {
    width: 40px; height: 40px;
    background: var(--primary);
    border: none; border-radius: 50%; cursor: pointer;
    color: #000; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Error state */
  .error-msg {
    text-align: center; padding: 24px 16px;
    color: #ff6666; font-size: 14px;
  }
</style>
</head>
<body>

<div class="demo-banner">
  ⚠️ Esta es una <strong>demostración no oficial de HecTechAI</strong> generada automáticamente con datos públicos. La información puede ser incompleta o inexacta. Para datos oficiales, consulta directamente al hotel.
</div>

<div class="header">
  <div class="avatar">🏨<div class="online-dot"></div></div>
  <div class="header-info">
    <h1 id="hotel-name">Cargando...</h1>
    <p>Asistente virtual · Demo HecTechAI</p>
  </div>
  <div class="demo-badge">DEMO</div>
</div>

<div class="messages" id="messages">
  <div class="msg bot">
    <div class="msg-avatar">🤖</div>
    <div class="bubble" id="welcome-bubble">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea
      id="input"
      placeholder="Escribe tu pregunta..."
      rows="1"
      disabled
    ></textarea>
  </div>
  <button class="send-btn" id="send-btn" disabled title="Enviar">➤</button>
</div>

<script>
(function() {
  const N8N = 'https://n8n.hectechai.com';
  const CHAT_URL   = N8N + '/webhook/chatbot/web';
  const POLL_URL   = N8N + '/webhook/chatbot/demo-poll';
  const POLL_MS    = 2500;
  const WELCOME_DELAY = 1200;

  const params = new URLSearchParams(location.search);
  const clientId   = params.get('c') || '';
  const widgetKey  = params.get('k') || '';
  const hotelNombre = decodeURIComponent(params.get('n') || 'Hotel Demo');

  const nameEl    = document.getElementById('hotel-name');
  const msgsEl    = document.getElementById('messages');
  const inputEl   = document.getElementById('input');
  const sendBtnEl = document.getElementById('send-btn');
  const welcomeEl = document.getElementById('welcome-bubble');

  // session key: unique per tab, persists until tab closed
  let sessionKey = sessionStorage.getItem('hec_demo_session');
  if (!sessionKey) {
    sessionKey = 'demo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
    sessionStorage.setItem('hec_demo_session', sessionKey);
  }

  nameEl.textContent = hotelNombre;
  document.title = hotelNombre + ' · Demo HecTechAI';

  // Config validation
  if (!clientId || !widgetKey) {
    welcomeEl.textContent = 'Enlace de demo incompleto. Contacta con HecTechAI para obtener un enlace válido.';
    return;
  }

  // Last polled timestamp
  let lastSince = new Date().toISOString();
  let pollTimer = null;
  let sending   = false;
  let typingEl  = null;

  function scrollBottom() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function addMessage(role, text) {
    const isBot = role === 'bot';
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (isBot ? 'bot' : 'user');
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = isBot ? '🤖' : '👤';
    const bbl = document.createElement('div');
    bbl.className = 'bubble';
    bbl.textContent = text;
    wrap.appendChild(av);
    wrap.appendChild(bbl);
    msgsEl.appendChild(wrap);
    scrollBottom();
    return bbl;
  }

  function showTyping() {
    if (typingEl) return;
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = '<div class="msg-avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    msgsEl.appendChild(wrap);
    typingEl = wrap;
    scrollBottom();
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function sendMessage(text) {
    if (sending || !text.trim()) return;
    sending = true;
    inputEl.disabled = true;
    sendBtnEl.disabled = true;
    addMessage('user', text.trim());
    showTyping();

    try {
      const res = await fetch(CHAT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Widget-Key': widgetKey
        },
        body: JSON.stringify({
          client_id: clientId,
          session_key: sessionKey,
          message: text.trim()
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // n8n responds with {"status":"received"} immediately
      // actual bot response comes via polling
    } catch (e) {
      hideTyping();
      addMessage('bot', '⚠️ Error al conectar con el servidor. Intenta de nuevo en unos segundos.');
      sending = false;
      inputEl.disabled = false;
      sendBtnEl.disabled = false;
      return;
    }

    // Start polling for response (up to 25s)
    let attempts = 0;
    const maxAttempts = 10;
    const pollForReply = async () => {
      if (attempts++ >= maxAttempts) {
        hideTyping();
        addMessage('bot', 'La respuesta está tardando más de lo esperado. Inténtalo de nuevo.');
        sending = false;
        inputEl.disabled = false;
        sendBtnEl.disabled = false;
        return;
      }
      const msgs = await pollMessages();
      if (msgs && msgs.length > 0) {
        hideTyping();
        msgs.forEach(m => { addMessage('bot', m.content); lastSince = m.created_at; });
        sending = false;
        inputEl.disabled = false;
        sendBtnEl.disabled = false;
        inputEl.focus();
      } else {
        setTimeout(pollForReply, POLL_MS);
      }
    };
    setTimeout(pollForReply, POLL_MS);
  }

  async function pollMessages() {
    try {
      const url = new URL(POLL_URL);
      url.searchParams.set('client_id',   clientId);
      url.searchParams.set('session_key', sessionKey);
      url.searchParams.set('widget_key',  widgetKey);
      url.searchParams.set('since',       lastSince);
      const res = await fetch(url.toString());
      if (!res.ok) return [];
      const data = await res.json();
      return Array.isArray(data.messages) ? data.messages : [];
    } catch (_) { return []; }
  }

  // Welcome message after delay
  setTimeout(() => {
    welcomeEl.innerHTML = `¡Hola! Soy el asistente virtual de <strong>${hotelNombre}</strong>. Esta es una demostración de HecTechAI 🤖<br><br>Puedo responder preguntas sobre el hotel con la información disponible en su web. ¿En qué puedo ayudarte?`;
    inputEl.disabled = false;
    sendBtnEl.disabled = false;
    inputEl.focus();
  }, WELCOME_DELAY);

  // Send on button click
  sendBtnEl.addEventListener('click', () => {
    const text = inputEl.value;
    inputEl.value = '';
    autoResize();
    sendMessage(text);
  });

  // Send on Enter (Shift+Enter = newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = inputEl.value;
      inputEl.value = '';
      autoResize();
      sendMessage(text);
    }
  });

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }
  inputEl.addEventListener('input', autoResize);
})();
</script>
</body>
</html>
